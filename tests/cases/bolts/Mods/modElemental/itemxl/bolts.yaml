# TweakXL-style syntax
ability:
  $(kind)_bolt _Stats:
    $base: bodkin_bolt _Stats
    $instances:
      - {kind: fire,  dmg: 20}
      - {kind: frost, dmg: 25}
    SilverDamage: {min: $(dmg), max: $(dmg)}
item:
  $(Kind) Bolt:
    $base: Bodkin Bolt
    $instances:
      - {Kind: Fire,  kind: fire,  price: 40, de: Feuerbolzen}
      - {Kind: Frost, kind: frost, price: 45, de: Frostbolzen}
    price: $(price)
    tags: !append-once [ElementalBolt]
    base_abilities:
      - !remove bodkin_bolt _Stats
      - !prepend $(kind)_bolt _Stats
    $text:
      name: {en: $(Kind) Bolt, de: $(de)}
  Bodkin Bolt:
    weight: !scale 2
loot:
  _store__Hattori_Master_Blacksmith:
    loot_entry: !append
      - {name: Fire Bolt, quantity_min: 10, quantity_max: 20, chance: 100}
      - {name: Frost Bolt, quantity_min: 10, quantity_max: 20}
