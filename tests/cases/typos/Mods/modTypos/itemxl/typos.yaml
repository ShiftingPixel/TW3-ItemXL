# Typos a validation has to catch (each is reported, the build still runs).
ability:
  ItemXL Typo Blade _Stats:
    $base: Novigraadan sword 4_crafted _Stats
    SlashingDamge: {type: base, min: 300}          # stat name misspelt
item:
  ItemXL Typo Scabbard:                             # hidden (NoShow): needs no icon or name, no warning
    $base: scabbard_steel_2_01
  ItemXL Typo Shown Scabbard:                       # shown: the missing icon and name are reported
    $base: scabbard_steel_2_01
    tags: [NoDrop]
  ItemXL Typo Blade:
    $base: Novigraadan sword 4_crafted
    prise: 400                                     # attribute misspelt
    "sell price": 400                              # not a name XML allows: an error, the field is left out
    base_abilities:
      - !append ItemXL Typo Blade Stats            # ability that does not exist
    $recipe:
      crafter: Smyth                               # crafter misspelt
      level: Master
      ingredients: {Steel ingott: 2}               # ingredient misspelt
